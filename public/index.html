<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Open-K: Contract Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <ul class="navbar-nav ml-left">
            <li class="nav-item">
                <input type="text" id="wallet_address" placeholder="wallet address" value="15tagV4TF6AawesDrWNmzsTp64wWr1oQet">
                    <button id="mana">mana</button>
                    <button id="send">send</button>

                <input type="text" id="contract_address" placeholder="contract address" value="14MjxccMUZrtBPXnNkuAC5MLtPev2Zsk3N">
                    <button id="balance">balance</button>
            </li>
        </ul>
        <ul class="navbar-nav ml-right">
            <li class="nav-item">
                <div id="_mana">
                    <div id="_mana_bar"></div>
                </div>
                <div id="_account"></div> 
            </li>
            <li id="_overlay" class="overlay">
                <div class="overlay-content">
                    <h2>Settings</h2>
                    <ul id="options">
                        <li>
                            <label class="switch">
                                <input type="checkbox" id="theme-toggle">
                                <span class="slider round"></span>
                            </label> 
                        </li>
                        <li><button class="_disconnect">Disconnect</button></li>
                    </ul>
                </div>
                <button class="close_element">Close</button>
            </li>
        </ul>
    </nav>

    <main class="container mt-4" id="_content">
        <h3>[Smart Contract Plugin]</h3>
    </main>

    <footer class="container mt-4 text-center">
        <p>&copy; 2024 Open-K </br> Powered by Koinos</p>
